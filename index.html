<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新記事へ移動中...</title>

    <!-- 【重要】ここのURLを、転送させたい「最新記事のURL」に書き換えます（0秒後に転送） -->
    <meta http-equiv="refresh" content="0;url=https://ameblo.jp/personwritep/entry-12760172571.html">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        .container { text-align: center; padding: 20px; }
        .spinner {
            border: 4px solid rgba(0,0,0,.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a { color: #09f; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>最新記事へ移動しています...</p>
        <!-- 万が一自動で移動しない場合の保険リンク（ここも上記と同じURLにする） -->
        <p><small>自動で移動しない場合は <a href="https://ameblo.jp/personwritep/entry-12760172571.html">こちらをクリックしてください</a></small></p>
    </div>

    <script>
        // meta refreshが動かないブラウザ用のJavaScript保険
        setTimeout(function() {
            window.location.href = "https://ameblo.jp/personwritep/entry-12760172571.html";
        }, 100);
    </script>
</body>
</html>
